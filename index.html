<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>et cetera</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --ocean-deep: #040d18;
  --ocean-mid:  #071829;
  --ocean-surf: #0a2540;
  --wave:       #0d3561;
  --horizon:    #0e4d8a;
  --sky:        #1565c0;
  --foam:       #1e88e5;
  --spray:      #42a5f5;
  --light:      #90caf9;
  --white:      #e8f4fd;
  --gold:       #ffd54f;
  --amber:      #ffb300;
  --teal:       #00acc1;
  --muted:      rgba(144,202,249,0.55);
  --border:     rgba(144,202,249,0.15);
  --border2:    rgba(144,202,249,0.22);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  background: var(--ocean-deep);
  color: var(--white);
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-canvas {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(21,101,192,0.4) 0%, transparent 55%),
    radial-gradient(ellipse 80% 40% at 80% 100%, rgba(0,172,193,0.15) 0%, transparent 50%),
    radial-gradient(ellipse 60% 30% at 10% 80%, rgba(13,53,97,0.45) 0%, transparent 50%),
    linear-gradient(180deg, #040d18 0%, #071829 50%, #040d18 100%);
}
.grid-overlay {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(144,202,249,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(144,202,249,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}

.content {
  position: relative; z-index: 1;
  max-width: 720px; margin: 0 auto;
  padding: 4.5rem 1.5rem 6rem;
}

/* ---- Title ---- */
.page-title {
  font-size: clamp(32px, 8vw, 52px); font-weight: 900;
  letter-spacing: -0.02em; line-height: 1.1;
  background: linear-gradient(135deg, var(--white) 0%, var(--spray) 55%, var(--teal) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 3.5rem;
  animation: fade-down 0.8s ease both;
}

/* ---- Section rhythm ---- */
.section { margin-bottom: 3.5rem; animation: fade-up 0.7s ease both; }
.section-num {
  font-family: 'DM Mono', monospace; font-size: 11px;
  letter-spacing: 0.14em; color: var(--teal);
  margin-bottom: 0.9rem;
}

/* ---- Memo / quote ---- */
.memo {
  position: relative;
  padding-left: 1.6rem;
  border-left: 2px solid var(--foam);
}
.memo p {
  font-size: clamp(19px, 3.4vw, 25px);
  line-height: 1.85;
  color: var(--white);
  font-weight: 500;
}
.memo p + p { margin-top: 0.4em; color: var(--light); }

/* ---- Videos ---- */
.video-list { display: flex; flex-direction: column; gap: 14px; }
.video-card {
  display: flex; gap: 14px;
  background: linear-gradient(145deg, rgba(13,53,97,0.5) 0%, rgba(7,24,41,0.7) 100%);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 10px;
  text-decoration: none; color: inherit;
  transition: border-color 0.2s ease, transform 0.2s cubic-bezier(.22,.68,0,1.2);
  backdrop-filter: blur(10px);
}
.video-card:hover { border-color: rgba(144,202,249,0.45); transform: translateY(-2px); }
.thumb-wrap {
  position: relative; flex: 0 0 160px; width: 160px; aspect-ratio: 16/9;
  border-radius: 8px; overflow: hidden; background: var(--ocean-surf);
}
.thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.play-badge {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(4,13,24,0.15);
}
.play-badge svg { width: 34px; height: 34px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
.video-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.video-title { font-size: 14.5px; font-weight: 700; color: var(--white); line-height: 1.45; }
.video-meta { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
.video-title.loading, .video-meta.loading { color: var(--muted); }
@keyframes shimmer { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }
.loading { animation: shimmer 1.4s ease-in-out infinite; }

@keyframes fade-down { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
@keyframes fade-up   { from { opacity:0; transform:translateY(14px);  } to { opacity:1; transform:translateY(0); } }
.section:nth-of-type(2) { animation-delay: 0.1s; }
.section:nth-of-type(3) { animation-delay: 0.18s; }

@media (max-width: 480px) {
  .content { padding: 3rem 1.1rem 4rem; }
  .video-card { flex-direction: column; }
  .thumb-wrap { width: 100%; flex: none; }
}
</style>
</head>
<body>

<div class="bg-canvas"></div>
<div class="grid-overlay"></div>

<div class="content">

  <h1 class="page-title">et cetera</h1>

  <div class="section">
    <div class="section-num">MEMO</div>
    <div class="memo">
      <p>君はいつ石炭を卒業できる？</p>
      <p>ダイヤモンド、それは最後まであきらめなかった石炭</p>
    </div>
  </div>

  <div class="section">
    <div class="section-num">紹介</div>
    <div class="video-list" id="videoList"></div>
  </div>

</div>

<script>
const VIDEOS = [
  'https://www.youtube.com/watch?v=yoQnDs9iR7c',
  'https://www.youtube.com/watch?v=PxCxEHl32Vg',
  'https://www.youtube.com/watch?v=wZqBRpuumVM',
  'https://www.youtube.com/watch?v=mZfryIyDJnA',
  'https://www.youtube.com/watch?v=Wvaq2klU728'
];

function extractId(url) {
  const m = url.match(/[?&]v=([^&]+)/);
  return m ? m[1] : null;
}

const list = document.getElementById('videoList');

VIDEOS.forEach((url, i) => {
  const id = extractId(url);
  const a = document.createElement('a');
  a.className = 'video-card';
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.innerHTML = `
    <div class="thumb-wrap">
      <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="">
      <div class="play-badge">
        <svg viewBox="0 0 68 48"><path d="M66.5 7.7c-.8-2.9-2.5-5.1-5.1-6C56.6.1 34 0 34 0S11.4.1 6.6 1.7C4 2.6 2.3 4.8 1.5 7.7 0 12.5 0 24 0 24s0 11.5 1.5 16.3c.8 2.9 2.5 5 5.1 5.9C11.4 47.9 34 48 34 48s22.6-.1 27.4-1.8c2.6-.9 4.3-3 5.1-5.9C68 35.5 68 24 68 24s0-11.5-1.5-16.3z" fill="rgba(4,13,24,0.55)"/><path d="M27 34.5l18-10.5-18-10.5v21z" fill="#fff"/></svg>
      </div>
    </div>
    <div class="video-body">
      <div class="video-title loading" id="title-${i}">読み込み中…</div>
      <div class="video-meta loading" id="meta-${i}">読み込み中…</div>
    </div>
  `;
  list.appendChild(a);

  fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`)
    .then(res => { if (!res.ok) throw new Error('oembed failed'); return res.json(); })
    .then(data => {
      const t = document.getElementById(`title-${i}`);
      const m = document.getElementById(`meta-${i}`);
      t.textContent = data.title || '（タイトル取得不可）';
      t.classList.remove('loading');
      m.textContent = data.author_name || '';
      m.classList.remove('loading');
    })
    .catch(() => {
      const t = document.getElementById(`title-${i}`);
      const m = document.getElementById(`meta-${i}`);
      t.textContent = 'YouTubeで見る';
      t.classList.remove('loading');
      m.textContent = url.replace('https://www.', '');
      m.classList.remove('loading');
    });
});
</script>
</body>
</html>
